# Blueprint de Render: crea el backend.
# En Render: New → Blueprint → elegir este repositorio.
# La base de datos está en Neon (neon.tech, plan gratis sin vencimiento):
# al aplicar el Blueprint, Render pide DATABASE_URL — pegar la connection
# string de Neon.
services:
  - type: web
    name: warp-consultas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
