(function(){
  try{
    // Clear any stale saved theme to ensure system preference is used on first load
    var saved = localStorage.getItem('wf-theme');
    var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    // If saved value doesn't match current version, clear it
    if(saved === 'light' || saved === null){
      // Use system preference
      saved = null;
    }
    var theme = saved !== null ? saved : (systemDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    if(theme === 'dark'){
      document.documentElement.style.background = '#0f1117';
      document.body && (document.body.style.background = '#0f1117');
    } else {
      document.documentElement.style.background = '#F0F3EE';
      document.body && (document.body.style.background = '#F0F3EE');
    }
  }catch(e){}
})();
