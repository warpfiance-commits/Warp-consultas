# Limpieza única: borra prueba-deploy.txt de la carpeta de Finanzas Inteligentes.
name: Probar FTP (archivo de prueba)

on:
  workflow_dispatch:

jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Borrar prueba-deploy.txt
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          printf 'user = "%s:%s"\n' "$FTP_USER" "$FTP_PASS" | \
            curl -K - --ssl-reqd --connect-timeout 20 -sS \
            --resolve "servidor.hstgr.io:21:$FTP_HOST" \
            -Q "DELE prueba-deploy.txt" "ftp://servidor.hstgr.io/"
          echo "Borrado."
