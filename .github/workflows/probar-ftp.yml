# Prueba de la conexión FTP: sube solo un archivo de texto a la carpeta
# de Finanzas Inteligentes. No toca index.html ni admin.html.
name: Probar FTP (archivo de prueba)

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Subir prueba-deploy.txt
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          echo "prueba de despliegue de Finanzas Inteligentes" > prueba-deploy.txt
          printf 'user = "%s:%s"\n' "$FTP_USER" "$FTP_PASS" | \
            curl -K - --ssl-reqd --connect-timeout 20 -sS -T prueba-deploy.txt \
            --resolve "servidor.hstgr.io:21:$FTP_HOST" \
            "ftp://servidor.hstgr.io/$FTP_DIR/prueba-deploy.txt"
          echo "Subido. Debe verse en https://form.warpfinance.co/prueba-deploy.txt"
