# Render (plan gratis) apaga el servidor tras 15 min sin visitas.
# Esta tarea lo visita cada 5 minutos para que siempre responda rápido.
name: Mantener servidor despierto

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Visitar /health
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 https://warp-consultas-t6sj.onrender.com/health
