# Publica index.html y admin.html en Hostinger (form.warpfinance.co)
# cada vez que cambian en main. El backend no pasa por aquí: Render se
# redespliega solo con cada push.
#
# Necesita estos secrets en GitHub → Settings → Secrets and variables → Actions:
#   FTP_HOST, FTP_USER, FTP_PASS, FTP_DIR   (los mismos de .env.deploy)
name: Publicar páginas en Hostinger

on:
  push:
    branches: [main]
    paths: [index.html, admin.html, finanzas-inteligentes.txt]
  workflow_dispatch:

concurrency:
  group: publicar-paginas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Subir por FTPS y comprobar
        run: node deploy.mjs --paginas
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
