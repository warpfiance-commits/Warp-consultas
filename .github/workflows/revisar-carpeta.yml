# Mantenimiento: lista (y opcionalmente limpia) archivos ajenos en la carpeta de
# Finanzas Inteligentes en Hostinger. Nunca toca index.html ni admin.html.
name: Revisar carpeta en Hostinger

on:
  workflow_dispatch:
    inputs:
      borrar:
        description: 'Archivos o carpetas a borrar, separados por espacio (vacío = solo listar)'
        required: false
        default: ''

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Listar y limpiar
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          BORRAR: ${{ github.event.inputs.borrar }}
        run: |
          set +e
          U="ftp://servidor.hstgr.io"
          ftp() { printf 'user = "%s:%s"\n' "$FTP_USER" "$FTP_PASS" | curl -K - --ssl-reqd --connect-timeout 20 -sS --resolve "servidor.hstgr.io:21:$FTP_HOST" "$@"; }
          comando() { ftp -Q "$1" "$U/" -o /dev/null 2>/dev/null; }
          echo "== Contenido"; ftp "$U/" | sed 's/^/   /'
          for p in $BORRAR; do
            case "$p" in index.html|admin.html|.|..|*/*) echo "omitido (protegido o ruta no permitida): $p"; continue;; esac
            # ¿Es carpeta? Si se puede listar como carpeta, se vacía y se elimina.
            nombres=$(ftp --list-only "$U/$p/" 2>/dev/null)
            if [ $? -eq 0 ]; then
              for n in $nombres; do
                [ "$n" = "." ] || [ "$n" = ".." ] || { comando "DELE $p/$n" && echo "archivo borrado: $p/$n" || echo "NO se pudo borrar: $p/$n"; }
              done
              comando "RMD $p" && echo "carpeta borrada: $p" || echo "NO se pudo borrar la carpeta: $p"
            else
              comando "DELE $p" && echo "archivo borrado: $p" || echo "NO se pudo borrar: $p"
            fi
          done
          if [ -n "$BORRAR" ]; then echo "== Contenido después"; ftp "$U/" | sed 's/^/   /'; fi
          exit 0
